name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # LAYERING (COMPLIANCE-AUDIT-2026-08-01.md): .githooks/pre-commit gives fast local structural
  # feedback and is bypassable by design (META_SKIP_HOOK=1 - a human can always choose to skip a
  # local hook, e.g. --no-verify). THIS job is the authority: it runs in CI, on every push and PR,
  # and cannot be skipped by a developer. A time-based rule (graph staleness - see the separate
  # graph-freshness.yml schedule) is deliberately NOT enforced here; a push job only fires on a
  # push, so a graph going stale from pure inaction between pushes would never trip it.
  # No Chromium, no suite build - pure Node + git log reads - so this is the fastest job here and
  # reports the discipline-gate result well before the Playwright job finishes.
  discipline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-meta's sub-checks (gate-lessons, check-release, check-board-fresh,
                          # check-h9, check-brief) all read git log history - a shallow checkout
                          # would silently starve them of the commits they need to compare against.

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Python is here for ONE gate: check-pytest. The suite verifying the agent-memory layer —
      # which holds every primary safety source — must run somewhere non-bypassable, and CI is
      # the only authority that is. It costs ~90s against a job that was ~30s, and that is the
      # trade being made deliberately.
      #
      # 3.14 specifically: agent_memory stores metadata as SQLite JSONB, which needs SQLite
      # >= 3.45. CPython pins SQLite per branch — 3.12 links 3.37.2 on some images, where
      # jsonb() does not exist at all.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install the Python test dependencies
        run: python -m pip install --quiet -r requirements.txt

      # Two steps, and it has to be two. requirements-overrides.txt holds pins that contradict a
      # package's own declared constraint, so installing both files together returns
      # ResolutionImpossible. --no-deps installs the pin alone. If this step is ever dropped, CI
      # silently reverts to the version upstream prefers — which is exactly what
      # tests/test_infra_deps.py fails on, deliberately.
      - name: Install the dependency overrides
        run: python -m pip install --quiet --no-deps -r requirements-overrides.txt

      - name: Verify the interpreter can do what the tests need
        run: |
          python -c "import sys, sqlite3; print(f'python {sys.version.split()[0]} sqlite {sqlite3.sqlite_version}')"
          python -c "import sqlite3; sqlite3.connect(':memory:').execute(\"select jsonb('{}')\"); print('jsonb: OK')"

      - name: Run the discipline gate (scripts/check-meta.mjs)
        run: node scripts/check-meta.mjs

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # build.py inlines app.js + app.css + the Python data layer into dist/index.html.
      # It imports only the standard library, so no pip install step is needed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer runs `python build.py && node serve.js <port>` itself,
      # so the build is exercised by the same command the suite uses locally.
      - name: Run the suite
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # The flake data has to come home from the machine that actually flakes. test-intel.db is
      # gitignored and local, so two clean local runs were recorded while the CI run that FAILED
      # was not — flakiness measurable everywhere except where it happens (R-96).
      - name: Upload the test-intelligence database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-intel-${{ github.run_id }}
          path: test-intel.db
          if-no-files-found: ignore
          retention-days: 30

  # The Worker suite runs the Managed-AI proxy against real workerd via
  # @cloudflare/vitest-pool-workers, which (with wrangler/miniflare) declares engines.node >=22.
  # It is a separate job — no Chromium, no Python — so a Worker regression and an app
  # regression report independently in the CI UI.
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Run the worker suite
        run: npm test
        working-directory: worker
