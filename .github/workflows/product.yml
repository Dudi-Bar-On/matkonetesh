name: product

# R-149 (2026-08-11), owner design: "the fact that both go through CI doesn't mean it has to be
# the SAME CI." This job (moved out of the former test.yml, alongside discipline/worker-tests
# which stayed unconditional in .github/workflows/infra.yml) builds dist/index.html and drives the
# app with a full Chromium suite — real product verification, ~20 minutes. `paths:` below means
# GitHub itself never starts this runner on a push/PR that cannot have changed the product; a push
# that only edits docs/**, *.md, .superpowers/**, mockups/** etc. reports NOTHING here (see point 2
# of the owner's brief — a path-filtered workflow that never runs is not a passing workflow, it is
# an absent one; nothing in this repo currently requires this workflow's status, verified via
# `gh api repos/:owner/:repo/branches/main/protection` → 404 "Branch not protected").
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'app.css'
      - 'build.py'
      - 'data.py'
      - 'sources.py'
      - 'serve.js'
      - 'playwright.config.ts'
      - 'tests/**/*.spec.ts'
      - 'worker/**'
      - '.github/workflows/product.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'app.css'
      - 'build.py'
      - 'data.py'
      - 'sources.py'
      - 'serve.js'
      - 'playwright.config.ts'
      - 'tests/**/*.spec.ts'
      - 'worker/**'
      - '.github/workflows/product.yml'

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # build.py inlines app.js + app.css + the Python data layer into dist/index.html.
      # It imports only the standard library, so no pip install step is needed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer runs `python build.py && node serve.js <port>` itself,
      # so the build is exercised by the same command the suite uses locally.
      - name: Run the suite
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # The flake data has to come home from the machine that actually flakes. test-intel.db is
      # gitignored and local, so two clean local runs were recorded while the CI run that FAILED
      # was not — flakiness measurable everywhere except where it happens (R-96).
      - name: Upload the test-intelligence database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-intel-${{ github.run_id }}
          path: test-intel.db
          if-no-files-found: ignore
          retention-days: 30
