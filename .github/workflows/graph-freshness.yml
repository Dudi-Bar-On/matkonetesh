# Why this is a separate, scheduled workflow and not a hook or a daemon:
#
# Graph freshness is a property of ELAPSED TIME and document drift, not of any single commit. That is
# exactly why neither a pre-commit hook nor a push-triggered job ever caught it going stale — nothing
# gets pushed during the hours in which documents quietly age past the graph. A schedule catches drift
# caused by inaction, and fails visibly in the Actions tab without ever blocking a legitimate push.
#
# A background daemon or file-watcher was considered and rejected. A daemon can die silently, which is
# precisely how the enforcement gap this workflow belongs to happened: the gate was not running and
# nothing announced it. A missing scheduled run shows up as a missing check in the CI UI; a dead daemon
# shows up as nothing at all. "Not running" must itself be an alarm, and only the CI platform gives that
# for free.
#
# Formatting note, learned the hard way: keep comments OUT of the mappings below. An earlier version
# carried trailing and continuation comments inside `on:` and inside step keys, and GitHub could not
# parse the file at all — it listed the workflow under its file path instead of its name and produced a
# zero-second startup failure on every push, while a manual dispatch returned HTTP 422 "Workflow does
# not have 'workflow_dispatch' trigger". A workflow that cannot be parsed is indistinguishable from one
# with nothing to report, which is the same silence this workflow exists to prevent.

name: graph-freshness

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  graph-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check graph freshness
        run: node scripts/check-graph-fresh.mjs
        env:
          CI: 'true'
