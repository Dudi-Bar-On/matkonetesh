# Knowledge stack — PostgreSQL/pgvector + Neo4j Community.
#
# Runs inside WSL2's Docker Engine (28.1.1). Docker Desktop is deliberately NOT used: it needs a
# reboot to join docker-users, and the owner works remotely and cannot reboot.
#
# VERSIONS ARE PINNED TO THE NEWEST RELEASE, never to `latest`. The owner asked for "always the
# newest"; a floating tag delivers that today and then silently swaps the database engine under a
# future `docker compose pull`. Pinning the newest version number gives the same software with a
# change that is visible in a diff.
#
# Both services bind to 127.0.0.1 ONLY. Nothing here is reachable from the network.

name: matconetesh-knowledge

# ⚠️ PostgreSQL IS NOT HERE ANY MORE — DO NOT ADD IT BACK (owner ruling, 2026-08-07, R-108).
#
# The geniza's PostgreSQL moved to a NATIVE Windows service on 2026-08-06: `postgresql-x64-18`,
# automatic startup, port 5432, pgvector 0.8.6 compiled against MSVC. The reason was availability,
# not preference — the machine rebooted itself at 02:27 and took Docker with it, WSL does not bring
# Docker back on its own, and seventeen hours of extraction were lost. A Windows service comes up at
# boot with nobody present.
#
# The `postgres` service stayed declared here for a day after that migration, and it mattered:
# `scripts/run-extraction.ps1` runs `docker compose up -d` to bring Neo4j up, so EVERY extraction run
# also resurrected the superseded database beside the live one. Measured 2026-08-06: the container
# held 853 documents / 877 revisions / 15,192 chunks, frozen at the migration; the native service held
# 855 / 921 / 16,526 and was what every tool actually talked to. A watchman component written from the
# stale plan text probed `docker exec mk-postgres` and would have reported the geniza healthy on the
# strength of a copy nobody had written to in a day.
#
# Retired properly, not deleted: `backups/mk_knowledge-container-retired-2026-08-07.dump` (174 MB,
# byte-identical in size to the migration's own final dump) plus `roles-container-retired-…sql`, both
# verified restorable via `pg_restore --list` — 114 entries, no errors, all three core tables present
# as TABLE DATA — BEFORE the container and its `mk-pgdata` volume were removed.
#
# Neo4j remains here, and remains in Docker: it holds 7,941 nodes with no bulk rebuild path, so moving
# it waits for the extraction work to finish.

services:
  neo4j:
    image: neo4j:2026.06.0-community
    container_name: mk-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_default__listen__address: 0.0.0.0
      # Bounded so a runaway traversal cannot take the machine with it.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      # APOC Core, installed 2026-08-05 against a CONFIRMED need, not "just in case".
      #
      # The need, verified by reading the installed source rather than the docs:
      # Neo4jPropertyGraphStore.upsert_nodes() calls apoc.create.addLabels and
      # upsert_relations() calls apoc.merge.relationship. Those are exactly the idempotent graph
      # upserts Phase 6 requires, and Cypher cannot parameterise a label or a relationship type,
      # which is what APOC is doing here. refresh_schema()'s apoc.meta.data is avoidable; the
      # upserts are not.
      #
      # Scoped deliberately: apoc.* procedures that touch the filesystem or the network are left
      # DISABLED (the defaults), so the surface added is graph manipulation only.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_import_file_enabled: "false"
      NEO4J_apoc_export_file_enabled: "false"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.meta.*,apoc.create.*,apoc.merge.*,apoc.map.*,apoc.any.*,apoc.schema.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.meta.*,apoc.create.*,apoc.merge.*,apoc.map.*,apoc.any.*,apoc.schema.*,apoc.coll.*"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT}:7474"   # browser / HTTP API
      - "127.0.0.1:${NEO4J_BOLT_PORT}:7687"   # Bolt driver
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
      - neo4jplugins:/plugins
    healthcheck:
      # Authenticated round-trip, not just a TCP open: a port that accepts and then refuses
      # every query is exactly the "green but broken" shape this project keeps meeting.
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  # `pgdata` / `mk-pgdata` removed with the postgres service (R-108). Its contents were dumped and the
  # dump verified restorable before the volume was deleted; see the header above for the file names.
  neo4jdata:
    name: mk-neo4jdata
  neo4jlogs:
    name: mk-neo4jlogs
  neo4jplugins:
    name: mk-neo4jplugins
